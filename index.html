            if (Array.isArray(val)) return val;
            if (typeof val === 'string' && val.trim().length > 0) return [val];
            return [];
        };

            const now = new Date();
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            const dateStr = now.toLocaleDateString('id-ID', options);
            const timeStr = now.toTimeString().split(' ')[0] + ' WIB';
            return `${dateStr}, ${timeStr} | SMAN 7 Kota Tangerang Selatan`;
        };

                    const afterPhotos = safeArray(b.afterPhotos);

                        return { ...b, status: 'Menunggu Persetujuan' };
                    }
                    return b;
                });
            });

            // LOGO PERMANEN BERBASIS BASE64 (TERSEMAT OTOMATIS)

            });

                const updatedRooms = rooms.map(room => {
                    const activeBooking = bookings.find(b => {
                        if (b.status !== 'Disetujui' && b.status !== 'Sedang Digunakan' && b.status !== 'Proses Pengajuan') return false;
                        if (b.roomId === room.id) return true;
                        
                        const searchTarget = `${b.roomName} ${b.activityName} ${b.notes}`.toLowerCase();
                        const cleanRoomName = room.name.toLowerCase().replace('ruang ', ''); 
                        const cleanRoomId = room.id.toLowerCase();
                        
                        return searchTarget.includes(cleanRoomName) || searchTarget.includes(cleanRoomId);
                    });

                    if (activeBooking) {
                        return { ...room, status: activeBooking.status === 'Proses Pengajuan' ? 'Proses Pengajuan' : 'Sedang Digunakan' };
                    } else {
                        if (room.status === 'Sedang Digunakan' || room.status === 'Proses Pengajuan') {
                            return { ...room, status: 'Tersedia' };
                        }
                    }
                    return room;
                });

                    (b.activityName && b.activityName.toLowerCase().includes(q)) ||

                                    <div><label className="font-semibold block mb-1">Keterangan / Keperluan</label><textarea name="notes" rows="2" placeholder="Keperluan peminjaman..." className="w-full border rounded-lg p-2"></textarea></div>
                                    <div className="flex justify-end gap-2 pt-3">
                                        <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-200 text-slate-800 rounded-xl font-semibold">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-xl font-semibold">Kirim Pengajuan</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl z-50 text-sm font-semibold border border-blue-500 animate-bounce no-print">
                            {toast}
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
