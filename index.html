        const compressImage = (base64Str, maxWidth = 500, quality = 0.35) => {
    return new Promise((resolve) => {
        const img = new Image();
        img.src = base64Str;
        img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => resolve(base64Str);
    });
};

                } catch (e) {}
                return [];
            });

            const fetchCloudData = (isBackground = true) => {
                fetch(GAS_URL)
                    .then(res => res.json())
                    .then(result => {
                        if (result.status === "success" && result.data) {
                            const parsedBookings = result.data.map(item => {
                                let parsedFull = null;
                                if (item.fullData) {
                                    try {
                                        parsedFull = typeof item.fullData === 'string' ? JSON.parse(item.fullData) : item.fullData;
                                    } catch(e) {}
                                }
                                
                                // Ambil foto dari fullData atau fallback langsung dari item jika ada
                                let cloudBefore = [];
                                let cloudAfter = [];
                                
                                if (parsedFull) {
                                    if (parsedFull.beforePhotos) cloudBefore = safeArray(parsedFull.beforePhotos);
                                    if (parsedFull.afterPhotos) cloudAfter = safeArray(parsedFull.afterPhotos);
                                }
                                
                                if (cloudBefore.length === 0 && item.beforePhotos) {
                                    cloudBefore = safeArray(item.beforePhotos);
                                }
                                if (cloudAfter.length === 0 && item.afterPhotos) {
                                    cloudAfter = safeArray(item.afterPhotos);
                                }
                                
                                const cloudStatus = item.status || (parsedFull && parsedFull.status) || 'Menunggu Persetujuan';

                                return {
                                    id: item.id,
                                    orgName: item.org || item.orgName || (parsedFull && parsedFull.orgName) || '',
                                    activityName: item.activity || item.activityName || (parsedFull && parsedFull.activityName) || '',
                                    roomName: item.room || item.roomName || (parsedFull && parsedFull.roomName) || '',
                                    date: item.date || (parsedFull && parsedFull.date) || '',
                                    startTime: item.startTime || (parsedFull && parsedFull.startTime) || '',
                                    endTime: item.endTime || (parsedFull && parsedFull.endTime) || '',
                                    applicantName: item.applicantName || (parsedFull && parsedFull.applicantName) || '',
                                    applicantNis: item.applicantNis || (parsedFull && parsedFull.applicantNis) || '',
                                    applicantClass: item.applicantClass || (parsedFull && parsedFull.applicantClass) || '',
                                    applicantWa: item.applicantWa || (parsedFull && parsedFull.applicantWa) || '',
                                    pjName: item.pjName || item.pic || (parsedFull && parsedFull.pjName) || '',
                                    pjNisNip: item.pjNisNip || (parsedFull && parsedFull.pjNisNip) || '',
                                    pjWa: item.pjWa || item.phone || (parsedFull && parsedFull.pjWa) || '',
                                    status: cloudStatus,
                                    notes: item.notes || (parsedFull && parsedFull.notes) || '',
                                    beforePhotos: cloudBefore,
                                    afterPhotos: cloudAfter,
                                    waliKelas: (parsedFull && parsedFull.waliKelas) || INITIAL_ROOMS.find(r => r.name === (item.room || item.roomName))?.waliKelas || '-',
                                    nipWali: (parsedFull && parsedFull.nipWali) || INITIAL_ROOMS.find(r => r.name === (item.room || item.roomName))?.nipWali || '-'
                                };
                            });
                            
                            setBookings(prev => {
                                const merged = parsedBookings.map(cloudItem => {
                                    const localMatch = prev.find(p => p.id === cloudItem.id);
                                    if (localMatch) {
                                        const localBefore = safeArray(localMatch.beforePhotos);
                                        const cloudBefore = safeArray(cloudItem.beforePhotos);
                                        const finalBefore = localBefore.length >= cloudBefore.length ? localBefore : cloudBefore;

                                        const localAfter = safeArray(localMatch.afterPhotos);
                                        const cloudAfter = safeArray(cloudItem.afterPhotos);
                                        const finalAfter = localAfter.length >= cloudAfter.length ? localAfter : cloudAfter;
                                        
                                        return {
                                            ...cloudItem,
                                            status: cloudItem.status,
                                            beforePhotos: finalBefore,
                                            afterPhotos: finalAfter
                                        };
                                    }
                                    return cloudItem;
                                });
                                localStorage.setItem('siperkas_bookings', JSON.stringify(merged));
                                return merged;
                            });
                        }
                    })
                    .catch(err => console.error("Gagal memuat data cloud:", err));

                        const searchTarget = `${b.roomName} ${b.activityName} ${b.notes}`.toLowerCase();
                        const cleanRoomName = room.name.toLowerCase().replace('ruang ', '');

                    if (activeBooking) {

                    return room;

                if (targetBooking) {
                    setSelectedBookingDetail(targetBooking);

                const beforeCount = safeArray(targetBooking.beforePhotos).length;
                const afterCount = safeArray(targetBooking.afterPhotos).length;
                const photoSummary = `Foto Awal: ${beforeCount} file | Foto Akhir: ${afterCount} file`;

                const payload = {
                    action: "saveBooking",
                    id: targetBooking.id || '',
                    org: targetBooking.orgName || targetBooking.org || '',
                    activity: targetBooking.activityName || targetBooking.activity || '',
                    room: targetBooking.roomName || targetBooking.room || '',
                    date: targetBooking.date || '',
                    startTime: targetBooking.startTime || '',
                    endTime: targetBooking.endTime || '',
                    applicantName: targetBooking.applicantName || '',
                    applicantNis: targetBooking.applicantNis || '',
                    applicantClass: targetBooking.applicantClass || '',
                    applicantWa: targetBooking.applicantWa || '',
                    pjName: targetBooking.pjName || '',
                    pjNisNip: targetBooking.pjNisNip || '',
                    pjWa: targetBooking.pjWa || '',
                    status: targetBooking.status || 'Menunggu Persetujuan',
                    notes: (targetBooking.notes || '').replace(/\s*\[Foto Awal:.*?\]/g, '') + ` [${photoSummary}]`,
                    fullData: JSON.stringify(targetBooking)

                fetch(GAS_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify(payload)

                .then(res => res.json())

                    console.log("Berhasil sinkron ke cloud:", res);
                    fetchCloudData(true);
                })
                .catch(err => console.error("Gagal menyimpan ke cloud:", err));

                                    <button onClick={() => setActiveModal(null)} className="bg-slate-200 text-slate-800 px-3 py-1.5 rounded-lg text-xs font-bold">Tutup</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* MODAL NEW BOOKING */}
                    {activeModal === 'new_booking' && (
                        <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 overflow-y-auto no-print">
                            <div className="bg-white rounded-2xl max-w-xl w-full p-6 shadow-2xl space-y-4 my-8">
                                <h3 className="text-lg font-bold text-slate-800">Formulir Pengajuan Peminjaman</h3>
                                <form onSubmit={(e) => {
                                    e.preventDefault();
                                    const fd = new FormData(e.target);
                                    const roomId = fd.get('roomId');
                                    const date = fd.get('date');
                                    const startTime = fd.get('startTime');
                                    const endTime = fd.get('endTime');
                                    const rObj = rooms.find(r => r.id === roomId);

                                    if (rObj && (rObj.status === 'Sedang Digunakan' || rObj.status === 'Proses Pengajuan')) {
                                        showToast(`Ruangan sedang digunakan!`);
                                        return;
                                    }

                                    const newB = {
                                        id: `SPK-${new Date().toISOString().slice(0,10).replace(/-/g,'')}-${Math.floor(100+Math.random()*900)}`,
                                        orgName: fd.get('orgName'),
                                        activityName: fd.get('activityName'),
                                        applicantName: fd.get('applicantName'),
                                        applicantNis: fd.get('applicantNis'),
                                        applicantClass: fd.get('applicantClass'),
                                        applicantWa: fd.get('applicantWa'),
                                        pjName: fd.get('pjName'),
                                        pjNisNip: fd.get('pjNisNip'),
                                        pjWa: fd.get('pjWa'),
                                        roomId: roomId,
                                        roomName: rObj ? rObj.name : 'Ruangan',
                                        waliKelas: rObj ? rObj.waliKelas : '-', // ✅ Otomatis mengambil wali kelas ruangan
                                        nipWali: rObj ? rObj.nipWali : '-',     // ✅ Otomatis mengambil NIP wali kelas
                                        date: date,
                                        startTime: startTime,
                                        endTime: endTime,
                                        notes: fd.get('notes'),
                                        status: 'Menunggu Persetujuan',
                                        beforePhotos: [],
                                        afterPhotos: []
                                    };
                                    
                                    const updatedBookings = [newB, ...bookings];
                                    saveBookingToCloud(updatedBookings, newB);
                                    logActivity(`Mengajukan peminjaman ${newB.id}`);
                                    showToast('Pengajuan berhasil dikirim!');
                                    setActiveModal(null);
                                }} className="space-y-3 text-xs">
                                    <div><label className="font-semibold block mb-1">Organisasi</label><select name="orgName" className="w-full border rounded-lg p-2 bg-white" required>{organizations.map(o => <option key={o.id} value={o.name}>{o.name}</option>)}</select></div>
                                    <div><label className="font-semibold block mb-1">Nama Kegiatan</label><input type="text" name="activityName" className="w-full border rounded-lg p-2" required /></div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <div><label className="font-semibold block mb-1">Nama Peminjam</label><input type="text" name="applicantName" className="w-full border rounded-lg p-2" required /></div>
                                        <div><label className="font-semibold block mb-1">NIS</label><input type="text" name="applicantNis" className="w-full border rounded-lg p-2" required /></div>
                                        <div><label className="font-semibold block mb-1">Kelas</label><input type="text" name="applicantClass" className="w-full border rounded-lg p-2" required /></div>
                                    </div>
                                    <div className="grid grid-cols-2 gap-2">
                                        <div><label className="font-semibold block mb-1">No WA Peminjam</label><input type="text" name="applicantWa" className="w-full border rounded-lg p-2" required /></div>
                                        <div>
                                            <label className="font-semibold block mb-1">Pilih Rombel / Ruangan</label>
                                            <select name="roomId" defaultValue={selectedPreselectedRoomId || rooms[0]?.id} className="w-full border rounded-lg p-2 bg-white font-semibold text-blue-600" required>
                                                {rooms.map(r => <option key={r.id} value={r.id}>{r.name} ({r.building}) — [{r.status}]</option>)}
                                            </select>
                                        </div>
                                    </div>
									
<div data-testid="form-date-time-grid" className="grid grid-cols-3 gap-2">
    <div><label className="font-semibold block mb-1">Tanggal</label><input type="date" name="date" className="w-full border rounded-lg p-2" required /></div>
    <div><label className="font-semibold block mb-1">Jam Mulai</label><input type="time" name="startTime" className="w-full border rounded-lg p-2" required /></div>
    <div><label className="font-semibold block mb-1">Jam Selesai</label><input type="time" name="endTime" className="w-full border rounded-lg p-2" required /></div>
</div>
                                    <div className="grid grid-cols-3 gap-2">
                                        <div><label className="font-semibold label block mb-1">Nama PJ</label><input type="text" name="pjName" className="w-full border rounded-lg p-2" required /></div>
                                        <div><label className="font-semibold block mb-1">NIS/NIP PJ</label><input type="text" name="pjNisNip" className="w-full border rounded-lg p-2" required /></div>
                                        <div><label className="font-semibold block mb-1">No WA PJ</label><input type="text" name="pjWa" className="w-full border rounded-lg p-2" required /></div>
                                    </div>
                                    <div><label className="font-semibold block mb-1">Catatan</label><textarea name="notes" rows="2" className="w-full border rounded-lg p-2"></textarea></div>
                                    <div className="flex justify-end gap-2 pt-3">
                                        <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-200 rounded-xl">Batal</button>
                                        <button type="submit" className="px-4 py-2 bg-blue-600 text-white rounded-xl">Kirim</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {toast && (
                        <div className="fixed bottom-6 right-6 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl z-50 text-sm font-semibold border border-blue-500 animate-bounce no-print">
                            {toast}
                        </div>
                    )}
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
